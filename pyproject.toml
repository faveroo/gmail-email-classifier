[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-email-classifier"
version = "0.1.0"
description = "Local email baseline with optional read-only Gmail sampling"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.6,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
gmail = ["google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2", "google-auth-httplib2>=0.2,<1"]
multilingual = ["huggingface_hub>=0.28,<2", "pandas>=2.2,<4", "pyarrow>=19,<30"]
dashboard = ["streamlit>=1.43,<2"]

[project.scripts]
email-classifier = "gmail_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
