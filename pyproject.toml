[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-email-classifier"
version = "0.1.0"
description = "Local synthetic two-stage email classification baseline"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.6,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
email-classifier = "gmail_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
